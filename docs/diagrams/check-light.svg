<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-label="Check diagram. role.txt is sent to Claude Opus 5 which returns a requirement list. Each requirement is embedded by Voyage and searched against Qdrant to build an EvidencePack. The pack plus profile.json go to Claude Haiku 4.5 which returns a status per requirement. Our code then verifies citations and computes the verdict, producing a FitReport."><style>
  .n-title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #13181C; }
  .n-sub   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #5D6A70; }
  .n-band  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.12em; fill: #8A959A; }
  .n-edge  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #5D6A70; }
  .n-data  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #13181C; }
  .n-box   { fill: #FFFFFF; stroke: #D5DCD9; stroke-width: 1; }
  .n-flow  { stroke: #D5DCD9; stroke-width: 1.5; fill: none; }
</style><rect width="100%" height="100%" fill="#FBFCFB"/>
      <defs>
        <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
