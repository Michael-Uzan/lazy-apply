        <text class="n-title" x="254" y="586">Verify citations</text>
        <text class="n-sub"   x="254" y="606">bad id → hard fail</text>
      </g>

      <g>
        <rect class="n-box" x="436" y="558" width="160" height="68" rx="3"></rect>
        <rect x="436" y="558" width="3" height="68" fill="#9BAEB8"></rect>
        <text class="n-title" x="452" y="586">verdict()</text>
        <text class="n-sub"   x="452" y="606">pure · no model</text>
      </g>

      <path class="n-flow" d="M398,592 L434,592" marker-end="url(#a2)"></path>
      <path class="n-flow" d="M596,592 L632,592" marker-end="url(#a2)"></path>

      <g>
        <rect x="634" y="546" width="358" height="92" rx="3" fill="#1B2327" stroke="#2C373B" stroke-width="1.5"></rect>
