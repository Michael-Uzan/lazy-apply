        <rect x="770" y="590" width="104" height="28" rx="2" fill="none" stroke="#F0C14B"></rect>
        <text x="822" y="609" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#F0C14B">BORDERLINE</text>
        <rect x="888" y="590" width="104" height="28" rx="2" fill="none" stroke="#F07A6E"></rect>
        <text x="940" y="609" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#F07A6E">SKIP</text>
