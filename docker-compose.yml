services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    container_name: lazyapply-qdrant
    ports:
      - "6333:6333"   # REST API + web UI at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_storage:
